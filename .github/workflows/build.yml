name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (plain JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew -p twitch-core test --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: twitch-core/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK platform 37 and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true
      - name: Build release APK (debug-signed, sideloadable)
        env:
          # Optional repository secret; without it the APK builds but shows a "configure client ID" screen.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S0undPlus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
