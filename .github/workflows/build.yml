name: Build

on:
  push:
    # Not tags: a v* tag is built (and signed) by release.yml, so building it here too would run everything twice.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (plain JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew -p twitch-core test --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: twitch-core/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Ensure Android SDK platform 37 and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true
      - name: Restore signing key (when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the configured stable key."
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret: falling back to the per-run debug key (builds won't install over each other)."
          fi
      - name: Build release APK
        env:
          # Optional repository secrets; without TWITCH_CLIENT_ID the APK shows a "configure client ID" screen.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build.log
      - name: Inspect the built APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          {
            echo "APK: $APK ($(du -h "$APK" | cut -f1))"
            echo "--- app classes present in dex (count of references) ---"
            for c in tv/ui/player/PlayerScreen tv/ui/home/HomeViewModel tv/ui/login/LoginScreen twitch/playback/PlaybackApi twitch/chat/ChatClient twitch/api/HelixApi; do
              n=$(unzip -p "$APK" 'classes*.dex' | grep -a -c "com/s0undplus/$c" || true); echo "com/s0undplus/$c: $n"
            done
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            echo "--- signer ---"
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -6 || true
            AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
            echo "--- aapt2 badging (manifest as packaged) ---"
            "$AAPT2" dump badging "$APK" | grep -E "^[[:space:]]*(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-feature|uses-feature-not-required|uses-implied-feature|feature-group|leanback-launchable-activity|launchable-activity|application:|application-banner|banner|uses-permission)" || true
          } | tee apk-inspection.txt
      - name: Android lint (non-blocking)
        continue-on-error: true
        run: |
          ./gradlew :app:lintRelease --console=plain || true
          R=$(ls app/build/reports/lint-results-release.txt 2>/dev/null || find app/build -name 'lint-results-release.txt' | head -1)
          echo "lint report: ${R:-none}"
          if [ -n "$R" ]; then
            { echo "--- lint ERRORS only ---"; grep -E ": Error:" "$R" | sed -E 's#/home/runner/work/S0undPlus/S0undPlus/##' | cut -c1-400; tail -n 1 "$R"; } | tee lint-errors.txt
          fi
          true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S0undPlus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: App unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee unit.log
      - name: Summary (compact, for quick reading)
        if: always()
        run: |
          echo "================ SUMMARY ================"
          if [ -f build.log ]; then
            echo "--- compiler errors (first 60) ---"
            grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/S0undPlus/S0undPlus/##' | cut -c1-320 | sort -u | head -60 || true
            grep -E "What went wrong" -A4 build.log | head -12 || true
          fi
          if [ -f unit.log ]; then
            echo "--- app unit tests ---"
            grep -E "FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)" unit.log | head -20 || true
          fi
          cat lint-errors.txt 2>/dev/null || echo "(no lint errors file)"
          cat apk-inspection.txt 2>/dev/null || echo "(no apk inspection)"
