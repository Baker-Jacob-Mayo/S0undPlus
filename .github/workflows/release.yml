name: Release

# Publishes a signed APK to GitHub Releases when you push a version tag:
#   git tag v1.1.0 && git push origin v1.1.0
# It refuses to publish unless the stable signing key and Twitch client ID secrets exist, because an APK signed with
# a throwaway debug key can't update existing installs (and the in-app updater would offer it to everyone).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Require signing and client-ID secrets
        run: |
          missing=0
          for v in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD TWITCH_CLIENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see README: Signing and releases)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Ensure Android SDK platform 37 and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true
      - name: Core tests
        run: ./gradlew -p twitch-core test --console=plain
      - name: Restore signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PappVersionName="${GITHUB_REF_NAME#v}" --console=plain
      - name: Verify the APK is signed with the release key (not the debug key)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee certs.txt
          # Positive check first: if apksigner printed no certificate at all, "not the debug key" would pass vacuously.
          if ! grep -q "certificate DN" certs.txt; then echo "::error::Could not read the APK signing certificate"; exit 1; fi
          if grep -qi "Android Debug" certs.txt; then echo "::error::APK is signed with the debug key; refusing to publish"; exit 1; fi
          cp "$APK" "S0undPlus-${GITHUB_REF_NAME}.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "S0undPlus-${GITHUB_REF_NAME}.apk" \
            --title "S0undPlus ${GITHUB_REF_NAME#v}" --generate-notes
